name: Update Blog Sitemap

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-blog-sitemap
  cancel-in-progress: false

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Check for sitemap changes
        id: changes
        run: |
          if git diff --quiet -- public/sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated sitemap
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          git commit -m "Update blog sitemap"
          git push origin HEAD:main

      - name: Send deployment notification
        if: steps.changes.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.BUILD_EMAIL_USERNAME }}
          password: ${{ secrets.BUILD_EMAIL_PASSWORD }}
          subject: "Moving in Mobile: Blog update triggered production build"
          to: gregorymdumas@gmail.com,tinarowe@kw.com
          from: Moving in Mobile Build <${{ secrets.BUILD_EMAIL_USERNAME }}>
          body: |
            A published blog change was detected in Sanity.

            The Moving in Mobile sitemap was updated and pushed to the main branch.
            This should trigger a new Hostinger production deployment.

            Blog:
            https://movinginmobile.com/blog

            Repository:
            https://github.com/Dumas0702/moving-in-mobile

            This is an automated notification.